services:
  - type: web
    name: mpscsc-claims-portal
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    # Persistent Disk — stores the SQLite DB so it survives every redeploy.
    # Without this, Render wipes the container filesystem on each deploy
    # and all users/data are deleted.
    disk:
      name: mpscsc-db
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES
        value: "7d"
      - key: ADMIN_EMAIL
        value: "admin@mpscsc.gov.in"
      - key: ADMIN_PASSWORD
        value: "Admin@123"
      - key: ADMIN_NAME
        value: "MPSCSC Administrator"
      - key: ADMIN_MOBILE
        value: "9876543210"
      - key: DB_PATH
        value: "/var/data/claims.db"
