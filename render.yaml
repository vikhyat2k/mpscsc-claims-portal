services:
  - type: web
    name: mpscsc-claims-portal
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES
        value: "7d"
      - key: ADMIN_EMAIL
        value: "admin@mpscsc.gov.in"
      - key: ADMIN_PASSWORD
        value: "Admin@123"
      - key: ADMIN_NAME
        value: "MPSCSC Administrator"
      - key: ADMIN_MOBILE
        value: "9876543210"
      # Auto-seed user accounts on every startup (survives redeploys).
      # Format: email|password|fullName|mobile  (one per line, comma-separated)
      # Example: user1@gmail.com|Pass@123|Ram Singh|9800000001,user2@gmail.com|Pass@123|Shyam Lal|9800000002
      - key: SEED_USERS
        value: "dmnanbetul1@gmail.com|Password@123|DM Betul|9800000001"
